name: Build and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "production"
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ftp
            artifact: ftp-site
            base-url: ${{ vars.FTP_BASE_URL || 'https://plataformas-moviles.tecnica4berazategui.edu.ar/' }}
            destination: dist/ftp
          - target: dokploy
            artifact: dokploy-site
            base-url: ${{ vars.DOKPLOY_BASE_URL || 'https://plataformas-moviles.apps.tec4.ar/' }}
            destination: dist/dokploy
          - target: vercel
            artifact: vercel-site
            base-url: ${{ vars.VERCEL_BASE_URL || 'https://plataformas-moviles.vercel.app/' }}
            destination: dist/vercel
          - target: github-pages
            artifact: github-pages-site
            base-url: ${{ vars.GITHUB_PAGES_BASE_URL || 'https://tehuel.github.io/plataformas-moviles/' }}
            destination: dist/github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.145.0'
          extended: true

      - name: Build with Hugo
        run: hugo --minify --baseURL "${{ matrix.base-url }}" --destination "${{ matrix.destination }}"

      - name: Upload ${{ matrix.target }} build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.destination }}
          if-no-files-found: error
          retention-days: 7

  deploy-ftp:
    name: Deploy FTP
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download FTP build
        uses: actions/download-artifact@v4
        with:
          name: ftp-site
          path: dist/ftp

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          local-dir: ./dist/ftp/
          server-dir: ${{ secrets.ftp_directory }}

  publish-static-branches:
    name: Publish ${{ matrix.target }} branch
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: dokploy
            artifact: dokploy-site
            branch: dokploy
          - target: vercel
            artifact: vercel-site
            branch: vercel
          - target: github-pages
            artifact: github-pages-site
            branch: gh-pages
    steps:
      - name: Download ${{ matrix.target }} build
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/site

      - name: Publish ${{ matrix.target }} branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ matrix.branch }}
          publish_dir: ./dist/site
          force_orphan: true
          enable_jekyll: false

      - name: Trigger Dokploy deployment
        if: matrix.target == 'dokploy'
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d '{"ref":"refs/heads/dokploy"}'
