name: Build and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "production"
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ftp
            artifact: ftp-site
            base-url: ${{ vars.FTP_BASE_URL || 'https://plataformas-moviles.tecnica4berazategui.edu.ar/' }}
            destination: dist/ftp
          - target: dokploy
            artifact: dokploy-site
            base-url: ${{ vars.DOKPLOY_BASE_URL || 'http://pm.apps.tec4.ar/' }}
            destination: dist/dokploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.145.0'
          extended: true

      - name: Build with Hugo
        run: hugo --minify --baseURL "${{ matrix.base-url }}" --destination "${{ matrix.destination }}"

      - name: Upload ${{ matrix.target }} build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.destination }}
          if-no-files-found: error
          retention-days: 7

  deploy-ftp:
    name: Deploy FTP
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download FTP build
        uses: actions/download-artifact@v4
        with:
          name: ftp-site
          path: dist/ftp

      - name: Deploy FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          local-dir: ./dist/ftp/
          server-dir: ${{ secrets.ftp_directory }}

  deploy-dokploy:
    name: Deploy Dokploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Dokploy build
        uses: actions/download-artifact@v4
        with:
          name: dokploy-site
          path: dist/dokploy

      - name: Publish Dokploy Static branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: dokploy
          publish_dir: ./dist/dokploy
          force_orphan: true
          enable_jekyll: false
