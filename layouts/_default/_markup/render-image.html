{{- $src := strings.TrimPrefix "/" .Destination | relURL -}}
{{- if .IsBlock -}}
<figure>
  <img src="{{ $src | safeURL }}" alt="{{ .PlainText }}">
  {{- with .Title }}<figcaption>{{ . }}</figcaption>{{ end -}}
</figure>
{{- else -}}
<img src="{{ $src | safeURL }}" alt="{{ .PlainText }}"{{ with .Title }} title="{{ . }}"{{ end }}>
{{- end -}}
