{{- $src := .Destination -}}
{{- if not (or (hasPrefix $src "http://") (hasPrefix $src "https://")) -}}
  {{- $src = printf "%s%s" site.Home.RelPermalink (strings.TrimPrefix "/" $src) -}}
{{- end -}}
<img src="{{ $src | safeURL }}"{{ with .Text }} alt="{{ . }}"{{ end }}{{ with .Title }} title="{{ . }}"{{ end }}>
