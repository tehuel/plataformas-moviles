{{- $src := strings.TrimPrefix "/" .Destination | relURL -}}
{{- if .IsBlock -}}
<figure>
  <img src="{{ $src | safeURL }}"{{ with .PlainText }} alt="{{ . }}"{{ end }}>
  {{- with .Title }}<figcaption>{{ . }}</figcaption>{{ end -}}
</figure>
{{- else -}}
<img src="{{ $src | safeURL }}"{{ with .PlainText }} alt="{{ . }}"{{ end }}{{ with .Title }} title="{{ . }}"{{ end }}>
{{- end -}}
